<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Card frame + red button demo</title>
    <!-- ES modules do not load from file://: serve this folder over http (any static server). -->
    <link rel="stylesheet" href="./card-frame.css" />
    <style>
      body {
        margin: 0;
        padding: 1.5rem 2.5rem 4rem;
        background: #0b0c0e;
        color: #d6d8dd;
        font-family: Georgia, serif;
      }
      .controls {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.5rem;
        align-items: center;
        margin: 0 -2.5rem 2.5rem;
        padding: 0.75rem 2.5rem;
        background: rgb(11 12 14 / 0.92);
        border-bottom: 1px solid #23252a;
        font: 13px/1.2 system-ui, sans-serif;
      }
      .controls label {
        display: flex;
        gap: 0.4rem;
        align-items: center;
      }
      .controls output {
        min-width: 2.5em;
        color: #9a9ea8;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 4.5rem 3.5rem;
      }
      .demo-card h2 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-variant: small-caps;
      }
      .demo-card p {
        margin: 0;
        line-height: 1.5;
        color: #b9bcc4;
      }
    </style>
  </head>
  <body>
    <form class="controls" id="controls" onsubmit="return false">
      <label>Button wobble <input name="wobble" type="range" min="0" max="2" step="0.1" value="0.6" /><output>0.6</output></label>
      <label>Chips <input name="chipCount" type="range" min="0" max="6" step="1" value="2" /><output>2</output></label>
      <label>Scratches <input name="scratchCount" type="range" min="0" max="8" step="1" value="2" /><output>2</output></label>
      <label>Grain <input name="grain" type="range" min="0" max="1" step="0.05" value="0.5" /><output>0.5</output></label>
      <label>Variant
        <select name="variant">
          <option value="danger">danger</option>
          <option value="primary">primary</option>
        </select>
      </label>
      <label><input name="disabled" type="checkbox" /> Disabled</label>
      <label><input name="bake" type="checkbox" checked /> Bake</label>
    </form>

    <main class="grid" id="grid"></main>

    <script type="module">
      import { createCardFrame } from './card-frame.js'

      const CARD_COUNT = 20
      const LABELS = ['Cancel', 'Close', 'Retreat', 'Abandon']
      const controls = document.getElementById('controls')
      const grid = document.getElementById('grid')

      const readControls = () => {
        const data = new FormData(controls)
        return {
          wobble: Number(data.get('wobble')),
          chipCount: Number(data.get('chipCount')),
          scratchCount: Number(data.get('scratchCount')),
          grain: Number(data.get('grain')),
          variant: data.get('variant'),
          disabled: data.has('disabled'),
          bake: data.has('bake'),
        }
      }

      const buildButtonOptions = (index, settings) => ({
        label: LABELS[index % LABELS.length],
        onClick: () => console.log(`card ${index}: ${LABELS[index % LABELS.length]}`),
        variant: settings.variant,
        wobble: settings.wobble,
        chipCount: settings.chipCount,
        scratchCount: settings.scratchCount,
        grain: settings.grain,
      })

      const createDemoCard = (index, settings) => {
        const element = document.createElement('article')
        element.className = 'demo-card'
        element.innerHTML = `<h2>Card ${index + 1}</h2><p>Seed ${100 + index * 17}. Worn leather, chipped iron, thorns. The text stays crisp and selectable.</p>`
        grid.append(element)
        const frame = createCardFrame(element, {
          seed: 100 + index * 17,
          bake: settings.bake,
          footer: { height: 64, button: buildButtonOptions(index, settings) },
        })
        return { element, frame }
      }

      const initialSettings = readControls()
      const cards = Array.from({ length: CARD_COUNT }, (_, index) => createDemoCard(index, initialSettings))

      const applySettings = () => {
        const settings = readControls()
        cards.forEach(({ element, frame }, index) => {
          frame.update({ bake: settings.bake, footer: { height: 64, button: buildButtonOptions(index, settings) } })
          const button = element.querySelector('.cf-btn')
          if (button) button.disabled = settings.disabled
        })
      }

      // Live readout while dragging; the buttons regenerate once the value is let go.
      controls.addEventListener('input', (event) => {
        const output = event.target.nextElementSibling
        if (output?.tagName === 'OUTPUT') output.value = event.target.value
      })
      controls.addEventListener('change', applySettings)
    </script>
  </body>
</html>
