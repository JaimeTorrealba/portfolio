# Static prerender (nuxt generate). There is deliberately no SPA catch-all rewrite: it
# answered every unknown URL, including /robots.txt, with the homepage and a 200, so
# crawlers saw soft 404s. Nuxt emits a 404.html, which Netlify serves with a real 404.
[build]
  command = "pnpm generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Security headers for every response. The enforced CSP only covers directives that cannot
# break the page (framing, <base>, plugins, forms). The full policy is Report-Only for now:
# the browser console lists anything it would block, so it can be enforced once a deploy
# shows no violations. 'unsafe-inline' scripts: Nuxt inlines its config script, and the
# gtag snippet in nuxt.config.js is inline too.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; font-src 'self'; media-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static files from public/ (and the detect-gpu benchmarks) keep fixed names, so they can't
# be cached forever like /_nuxt/*. A week, then a background revalidation.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/detect-gpu-benchmarks/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/walking-sound.mp3"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Markdown twins of the homepage: serve as Markdown, and point search engines at the
# HTML page as the canonical version. `/` itself also returns this Markdown to clients
# that send `Accept: text/markdown` (netlify/edge-functions/markdown-negotiation.js).
[[headers]]
  for = "/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Link = '<https://jaimetorrealba.com/>; rel="canonical"'

[[headers]]
  for = "/index.html.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Link = '<https://jaimetorrealba.com/>; rel="canonical"'

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
